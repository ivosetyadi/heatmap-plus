# Example: render your contribution card daily and commit it. Copy into your
# repo at .github/workflows/heatmap.yml
name: Heatmap+
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ivosetyadi/heatmap-plus@v1
        with:
          theme: dark
          output: heatmap.svg
          commit: true
